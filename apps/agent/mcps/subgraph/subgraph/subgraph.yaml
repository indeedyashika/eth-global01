specVersion: 0.0.9
description: Indexes Transfer events for a single ERC20 on Sepolia (graph_experiments)
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ERC20Token
    network: sepolia
    source:
      address: '0xf531b8f309be94191af87605cfbf600d71c2cfe0'
      abi: ERC20
      startBlock: 11350000
    mapping: &ref_0
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - Account
        - Transfer
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
  - kind: ethereum
    name: ERC20Token2
    network: sepolia
    source:
      address: '0x10279e6333f9d0ee103f4715b8aaea75be61464c'
      abi: ERC20
      startBlock: 11350429
    mapping: *ref_0
